name: Build Android Client APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test logic lõi trên host (scanner, patcher, LRU, ring, CPS)
        run: tools/run_host_tests.sh

  build:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cài NDK 25.1
        run: sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Cài Gradle (dự án không kèm gradlew)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BedrockClient-APK
          path: app/build/outputs/apk/release/*.apk
